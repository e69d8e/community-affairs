# ========== 生产 / 容器全量模式 Nginx 站点配置 ==========
# 反向代理目标为 Docker 内部网络中的 ca-app 容器
# 注意：本项目后端 Controller 自带 /api 前缀，代理时原样转发、不做前缀重写
upstream ca-app {
    server ca-app:8082;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;
    charset utf-8;

    # 客户端最大上传限制（与后端 multipart 20MB 保持一致）
    client_max_body_size 20m;

    # 前端 SPA 静态页面
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 REST 接口代理（原样转发 /api 前缀）
    location /api {
        proxy_pass http://ca-app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 20m;
    }

    # WebSocket 实时消息代理（SockJS 回退握手同样命中 /ws/** 路径）
    location /ws {
        proxy_pass http://ca-app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Knife4j API 文档支持
    location ~* ^/(doc\.html|webjars|v3/api-docs|swagger-resources) {
        proxy_pass http://ca-app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }
}
